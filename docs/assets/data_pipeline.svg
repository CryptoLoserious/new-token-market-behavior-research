<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img"><title>Data feasibility pipeline</title><rect width="960" height="360" rx="16" fill="#f5f8fb"/><text x="30" y="40" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#172b43" text-anchor="start">Data feasibility pipeline</text><text x="30" y="68" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#52677c" text-anchor="start">Separate candidate discovery from verified research observations</text><rect x="30" y="116" width="202" height="130" rx="12" fill="#ffffff" stroke="#cbd9e3"/><text x="45" y="145" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#172b43" text-anchor="start">Announcements</text><text x="45" y="177" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#172b43" text-anchor="start">Public notices</text><text x="45" y="202" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#52677c" text-anchor="start">Candidate events</text><path d="M235 181 L257 181" stroke="#176e91" stroke-width="2" fill="none"/><path d="M249 176 L257 181 L249 186" fill="none" stroke="#176e91" stroke-width="2"/><rect x="260" y="116" width="202" height="130" rx="12" fill="#ffffff" stroke="#cbd9e3"/><text x="275" y="145" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#172b43" text-anchor="start">Eligibility</text><text x="275" y="177" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#172b43" text-anchor="start">Identity checks</text><text x="275" y="202" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#52677c" text-anchor="start">Trading history</text><path d="M465 181 L487 181" stroke="#176e91" stroke-width="2" fill="none"/><path d="M479 176 L487 181 L479 186" fill="none" stroke="#176e91" stroke-width="2"/><rect x="490" y="116" width="202" height="130" rx="12" fill="#ffffff" stroke="#cbd9e3"/><text x="505" y="145" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#172b43" text-anchor="start">Market data</text><text x="505" y="177" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#172b43" text-anchor="start">Historical candles</text><text x="505" y="202" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#52677c" text-anchor="start">Time alignment</text><path d="M695 181 L717 181" stroke="#176e91" stroke-width="2" fill="none"/><path d="M709 176 L717 181 L709 186" fill="none" stroke="#176e91" stroke-width="2"/><rect x="720" y="116" width="202" height="130" rx="12" fill="#ffffff" stroke="#cbd9e3"/><text x="735" y="145" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#172b43" text-anchor="start">Quality gate</text><text x="735" y="177" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#172b43" text-anchor="start">Continuity checks</text><text x="735" y="202" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#52677c" text-anchor="start">Accepted / flagged</text><path d="M30 318 L930 318" stroke="#cbd9e3" stroke-width="1" fill="none"/><text x="30" y="341" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#52677c" text-anchor="start">Conceptual workflow | No cohort counts or proprietary filters</text></svg>
